name: Release to npm

# Runs only when the owner pushes a tag such as ts-v0.1.0.
on:
  push:
    tags: ["ts-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # bundles npm 11.5.1+, which trusted publishing needs
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: The tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "ts-v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
