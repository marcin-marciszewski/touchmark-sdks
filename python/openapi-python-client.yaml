# Models only: the hand-written client in touchmark/_client.py makes the
# requests, so scripts/generate.sh removes the generated request code.
project_name_override: touchmark
package_name_override: _gen
post_hooks:
  - "uvx ruff@0.13.0 check --fix-only --quiet ."
  - "uvx ruff@0.13.0 format --quiet ."
